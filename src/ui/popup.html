<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Netflix Decision Layer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 280px; padding: 12px; margin: 0; background: #141414; color: #fff; }
    h2 { margin: 0 0 10px; font-size: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .row .label { font-size: 12px; color: #ccc; }
    .status { font-size: 11px; color: #888; margin-top: 8px; }
    .link { display: block; margin-top: 8px; color: #e50914; text-decoration: none; font-size: 12px; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Netflix Decision Layer</h2>
  <div class="row"><span class="label">Overlay</span><input type="checkbox" id="overlayEnabled" /></div>
  <div class="row"><span class="label">Filtering</span><input type="checkbox" id="filterEnabled" /></div>
  <div class="row"><span class="label">Personalization</span><input type="checkbox" id="personalizationEnabled" /></div>
  <div class="status" id="status">Loading...</div>
  <a href="#" class="link" id="options">Open settings</a>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
